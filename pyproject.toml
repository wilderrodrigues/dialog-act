[project]
name = "dialog"
version = "0.1.0"
description = "Dialog system developed for the Methods in AI Research course."
authors = [{name = "Dexter"}, {name = "Jiacheng"}, {name = "Remy"}, {name = "Wilder"}]
readme = "README.md"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "numpy",
    "torch",
    "tokenizers",
    "numpy",
    "typer",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn (==1.9.1)",  # the pickled logistic-regression model in model-zoo/ was saved with this version
    "shap",
    "transformers",
    "levenshtein (>=0.27.5,<0.28.0)",
    "pydantic (>=2.14.1,<3.0.0)"
]

[project.scripts]
dialog-acts = "uu.msc.ai.mair.cli:app"

[tool.poetry]
packages = [{include = "uu", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0,<10.0"
httpx = ">=0.28,<1.0"  # FastAPI's TestClient (web/tests)

# The web interface for the user study (web/): `poetry install --with web`.
[tool.poetry.group.web]
optional = true

[tool.poetry.group.web.dependencies]
fastapi = ">=0.117.1"
uvicorn = ">=0.30"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=2.1,<3.0"]
build-backend = "poetry.core.masonry.api"