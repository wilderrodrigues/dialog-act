[project]
name = "dialog-web"
version = "0.1.0"
description = "Web interface for the restaurant recommender dialog system."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.117.1",
    "numpy",
    "pandas",
    "scikit-learn==1.9.1",  # must match the version the pickled logistic-regression model was trained with
    "levenshtein>=0.27.5,<0.28.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python scripts/bundle_core.py"
